[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrite64-mcp"
version = "0.1.0"
description = "Pyrite64 project and live-editor MCP for Codex and Claude"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pyrite64-mcp = "pyrite64_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyrite64_mcp = ["data/*.json", "data/*.gz", "data/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
